name: Build, push and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: maulabs
  IMAGE_NAME: tourplannerbot
  DO_APP_ID: ${{ vars.DO_APP_ID }}
  DO_DATABASE_ID: ${{ vars.DO_DATABASE_ID || '8e0c4d93-6f34-4a3a-bbce-8fc3703357d6' }}
  ACCESS_PIN: 2013

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_metadata.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: image_metadata
        shell: bash
        run: |
          SANITIZED_BRANCH=$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-120)
          if [[ -z "${SANITIZED_BRANCH}" ]]; then
            echo "Could not create a Docker tag from branch ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          SHORT_SHA=${GITHUB_SHA:0:7}
          IMAGE_TAG=${SANITIZED_BRANCH}_${SHORT_SHA}
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
          echo "Building version ${IMAGE_TAG} at ${BUILD_TIME}."

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ steps.image_metadata.outputs.image_tag }}
          BUILD_TIME: ${{ steps.image_metadata.outputs.build_time }}
        run: |
          IMAGE_REPOSITORY=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}
          docker build \
            --build-arg VERSION="${IMAGE_TAG}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --tag "${IMAGE_REPOSITORY}:latest" \
            .
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${IMAGE_REPOSITORY}:latest"

  migrate:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install Goose
        run: bash scripts/install-goose.sh

      - name: Allow migration runner in database firewall
        id: runner_firewall
        run: bash scripts/allow-database-runner.sh

      - name: Run PostgreSQL migrations
        run: bash scripts/run-goose-migrations.sh

      - name: Remove migration runner from database firewall
        if: always() && steps.runner_firewall.outputs.runner_firewall_rule_added == 'true'
        env:
          RUNNER_FIREWALL_RULE_UUID: ${{ steps.runner_firewall.outputs.runner_firewall_rule_uuid }}
          RUNNER_IP: ${{ steps.runner_firewall.outputs.runner_ip }}
        run: bash scripts/remove-database-runner.sh

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - migrate
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_CHAT_ID: ${{ vars.TELEGRAM_GROUP_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TOOLS_BIGIN_CLIENT_ID: ${{ vars.TOOLS_BIGIN_CLIENT_ID }}
      TOOLS_BIGIN_REFRESH_TOKEN: ${{ secrets.TOOLS_BIGIN_REFRESH_TOKEN }}
      TOOLS_BIGIN_CLIENT_SECRET: ${{ secrets.TOOLS_BIGIN_CLIENT_SECRET }}
      TOOLS_GMAIL_CLIENT_ID: ${{ vars.TOOLS_GMAIL_CLIENT_ID }}
      TOOLS_GMAIL_REFRESH_TOKEN: ${{ secrets.TOOLS_GMAIL_REFRESH_TOKEN }}
      TOOLS_GMAIL_CLIENT_SECRET: ${{ secrets.TOOLS_GMAIL_CLIENT_SECRET }}
      TOOLS_BRAVE_TOKEN: ${{ secrets.TOOLS_BRAVE_TOKEN }}
      TOOLS_JINA_TOKEN: ${{ secrets.TOOLS_JINA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to DO App Platform
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: bash scripts/deploy-app.sh
