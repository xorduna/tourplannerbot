name: Build, push and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: maulabs
  IMAGE_NAME: tourplannerbot
  DO_APP_ID: ${{ vars.DO_APP_ID }}
  DO_DATABASE_ID: ${{ vars.DO_DATABASE_ID || 'db-postgresql-lon1-84522' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

  migrate:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install Goose
        run: bash scripts/install-goose.sh

      - name: Allow migration runner in database firewall
        id: runner_firewall
        run: bash scripts/allow-database-runner.sh

      - name: Run PostgreSQL migrations
        run: bash scripts/run-goose-migrations.sh

      - name: Remove migration runner from database firewall
        if: always() && steps.runner_firewall.outputs.runner_firewall_rule_added == 'true'
        env:
          RUNNER_FIREWALL_RULE_UUID: ${{ steps.runner_firewall.outputs.runner_firewall_rule_uuid }}
          RUNNER_IP: ${{ steps.runner_firewall.outputs.runner_ip }}
        run: bash scripts/remove-database-runner.sh

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    env:
      ACCESS_PIN: ${{ secrets.ACCESS_PIN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Allow App Platform application in database firewall
        run: bash scripts/allow-database-app.sh

      - name: Deploy to DO App Platform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/deploy-app.sh
