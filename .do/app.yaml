name: tourplannerbot
region: lon  # change to your preferred region (nyc, sfo, fra, sgp, etc.)

services:
  - name: web
    image:
      registry_type: DOCR
      registry: maulabs  # replace with your DO registry name
      repository: tourplannerbot
      tag: ${IMAGE_TAG}
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    health_check:
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
      http_path: /healthz
    liveness_health_check:
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
      http_path: /healthz
    envs:
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: "${TELEGRAM_BOT_TOKEN}"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: "${DATABASE_URL}"
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${OPENAI_API_KEY}"
      - key: ACCESS_PIN
        scope: RUN_TIME
        type: SECRET
        value: "${ACCESS_PIN}"
      - key: OPENAI_MODEL
        scope: RUN_TIME
        value: gpt-5.6-luna
      - key: OPENAI_BASE_URL
        scope: RUN_TIME
        value: https://api.openai.com/v1
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: APP_BASE_URL
        scope: RUN_TIME
        value: "${APP_BASE_URL}"

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
